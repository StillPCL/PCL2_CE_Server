name: Deploy static API

on:
  push:
    branches: [main]
    paths:
      - 'apiv2/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: apiv2
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare API and cache hashes
        run: |
          mkdir site
          cp -r apiv2 site/
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("site/apiv2")
          cache = json.loads((root / "cache.json").read_text())
          for path in [root / "announcement.json", *sorted((root / "updates").glob("updates-*.json"))]:
              json.loads(path.read_text())
              cache[path.stem] = hashlib.md5(path.read_bytes()).hexdigest()
          (root / "cache.json").write_text(json.dumps(cache) + "\n")
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
